services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: user_tracker
      DB_USER: tracker_user
      DB_PASSWORD: tracker_password
      TZ: UTC
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: user_tracker
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: tracker_password
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP instead of the socket: the temporary server that runs the init scripts listens only on the socket.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  db_data: